aid: kotcha
name: Kotcha
description: 'Kotcha is a consumer running-coaching mobile application operated by PACEUP SAS, a French
  company based in Paris, and co-founded with marathon world-record holder Eliud Kipchoge and the NN
  Running Team. The app generates personalized, adaptive training plans for 5K, 10K, half-marathon and
  marathon distances, delivered through a conversational AI coach that adapts to completed workouts, and
  it imports activity and health data from Strava, Garmin Connect, Apple, Coros and Huawei wearables.
  Kotcha raised EUR 3.5M in October 2025 in a round led by Racine2, operated by Serena and makesense.
  Kotcha is a consumer subscription product distributed through the Apple App Store and Google Play; it
  publishes no developer portal, no API documentation and no machine-readable API contract, and its
  terms of service explicitly prohibit automated access to the service. This profile records that
  absence rather than an API surface.'
